services:
  trmnl-guitar-webhook:
    image: python:3.12-alpine
    container_name: trmnl-guitar-webhook
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - TRMNL_WEBHOOK_URL=${TRMNL_WEBHOOK_URL}
      - PUSH_INTERVAL_SECONDS=1800
      - PORT=8085
    ports:
      - "8085:8085"
    command: ["python3", "-u", "trmnl_chord_webhook.py"]
    restart: unless-stopped
