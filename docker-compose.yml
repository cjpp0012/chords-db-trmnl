services:
  trmnl-guitar-webhook:
    image: python:3.12-alpine
    container_name: trmnl-guitar-webhook
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - TRMNL_WEBHOOK_URL=https://trmnl.com/api/custom_plugins/ea5b672f-aaf1-43a3-b9bc-53e695e165db
      - PUSH_INTERVAL_SECONDS=1800
      - PORT=8085
    ports:
      - "8085:8085"
    command: ["python3", "-u", "trmnl_chord_webhook.py"]
    restart: unless-stopped
